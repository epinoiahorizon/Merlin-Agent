# Merlin Gateway — nginx (disarankan)
#
# Host ini sudah memakai nginx + certbot untuk domain lain, jadi menambah server block lebih aman
# daripada memasang TLS terminator kedua. Ganti __GW_DOMAIN__ (dashboard) dan __API_DOMAIN__ (gateway).
#
#   sudo cp merlin-gateway.conf /etc/nginx/sites-available/merlin-gateway
#   sudo sed -i "s/__GW_DOMAIN__/gw.example.com/g; s/__API_DOMAIN__/api.example.com/g" \
#        /etc/nginx/sites-available/merlin-gateway
#   sudo ln -sf /etc/nginx/sites-available/merlin-gateway /etc/nginx/sites-enabled/merlin-gateway
#   sudo certbot --nginx -d gw.example.com -d api.example.com     # sekali saja
#   sudo nginx -t && sudo systemctl reload nginx

upstream merlin_dashboard { server 127.0.0.1:8680; keepalive 8; }
upstream merlin_gateway   { server 127.0.0.1:8645; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name __GW_DOMAIN__ __API_DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __GW_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__GW_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__GW_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://merlin_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Payload chat/embedding kecil; batas ini mencegah penyalahgunaan.
    client_max_body_size 20m;

    location / {
        proxy_pass http://merlin_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: tanpa ini jawaban streaming tertahan di buffer nginx lalu keluar sekaligus di akhir.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
