description: The Merlin desktop app in your browser. `merlin workbench` serves the desktop interface through the Merlin dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Atlas product. On the first `merlin workbench` run and again after each Merlin update it runs `npm install --ignore-scripts` (guided by Merlin's lockfile) and Vite against your Merlin checkout's desktop sources, writing only under ~/.merlin/merlin-workbench and its own plugin dir (the checkout is only read), and starts `merlin dashboard` on loopback when none is running.
