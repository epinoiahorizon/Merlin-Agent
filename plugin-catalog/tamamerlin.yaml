name: tamamerlin
repo: https://github.com/ahrazzle/TamaMerlin
subdir: plugins/tamamerlin
sha: d25f76fdf5d8032910ffbe1dca3ba00bf442061f
description: >-
  Grow a local TamaMerlin pet from real Merlin agent activity. Disclosure — hooks write a pet
  ledger and sprite atlas under $MERLIN_HOME only; the optional python -m tamamerlin CLI
  additionally reads/writes ~/.codex, ~/.petdex and ~/.evopet, runs an unauthenticated loopback
  preview server (127.0.0.1:8765) and on macOS compiles a Swift overlay and installs a
  RunAtLoad+KeepAlive LaunchAgent with no uninstall command. No network egress, no credential
  reads.
maintainer: ahrazzle
tier: community
category: general
requires_merlin: ">=0.21"
docs_url: https://github.com/ahrazzle/TamaMerlin
version: "1.2.3"
readme: true
platforms:
  - macos
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - post_tool_call
    - post_api_request
    - on_session_end
  provides_middleware: []
  requires_env: []
