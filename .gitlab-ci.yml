# Merlin Agent CI on GitLab.
#
# Quality gates: test-python (scripts/run_tests_parallel.py) and test-js
# (scripts/ci/run-workspace-checks.mjs) run on GitLab SaaS runners. Docs build
# + GitLab Pages deploy and the Ultimate-only scanners also run on hosted
# runners, guarded by $GITLAB_FEATURES where the licence applies.
#
default:
  interruptible: true

# Keep the MR pipeline while a merge request is open, the branch pipeline
# otherwise — otherwise GitLab creates BOTH pipelines for the same commit.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [build, test, deploy]

build-docs:
  stage: build
  image: node:24
  tags: [saas-linux-small-amd64]
  variables:
    NODE_ENV: production
  before_script:
    # prebuild.mjs runs the skill/plugin extractors, which import ruamel.yaml.
    - apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
    - python3 -m pip install --break-system-packages -q ruamel.yaml
  script:
    - cd website
    # GitLab Pages serves this project at the ROOT of its canonical domain, so
    # the Docusaurus /docs/ base URL has to be overridden or every asset 404s.
    - npm ci --no-audit --no-fund
    - DOCS_BASE_URL="/" npm run build
  artifacts:
    paths:
      - website/build/
    expire_in: 1 week

pages:
  stage: deploy
  image: alpine:3
  tags: [saas-linux-small-amd64]
  needs: [build-docs]
  script:
    - mkdir -p public
    - cp -r website/build/. public/
    - test -f public/index.html
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# Ultimate-only scanners. All of them are Docker-image analyzers, so every one
# is pinned to the hosted runner. Their rules read $GITLAB_FEATURES: when the
# licence stops providing security_dashboard the jobs vanish, leaving no
# permanent red instead of failing on "feature not available".
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# The `sast` stub job in the template is a configuration-only stub whose script
# exits 1 on purpose; overriding its rules resurrects it and fails the
# pipeline. The override belongs on the real analyzer, semgrep-sast.
semgrep-sast:
  tags: [saas-linux-small-amd64]
  needs: []
  rules:
    - if: '$GITLAB_FEATURES =~ /security_dashboard/'

secret_detection:
  tags: [saas-linux-small-amd64]
  needs: []
  rules:
    - if: '$GITLAB_FEATURES =~ /security_dashboard/'

# Phase 2 of moving CI off self-hosted machines entirely: the two quality gates
# now run as container jobs on the free SaaS runners (the repo is public, so
# minutes are unlimited), with no per-machine PATH or WSL quirks. Entry points
# are unchanged from the GitHub workflows, so results stay comparable:
# scripts/run_tests_parallel.py for Python (one pytest per file, isolated
# interpreter) and scripts/ci/run-workspace-checks.mjs for JS (expands every
# check:* script instead of the serial npm --ws chain).
#
# allow_failure stays for one iteration to compare the SaaS results against the
# known WSL baseline; flip it off once both gates are green here.
test-python:
  stage: test
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  needs: []
  allow_failure: true
  timeout: 90m
  variables:
    GIT_DEPTH: "50"
  script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates git xz-utils >/dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --locked --all-extras --group dev --group test
    - MERLIN_TEST_WORKERS=4 .venv/bin/python scripts/run_tests_parallel.py -q
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test-js:
  stage: test
  image: node:24
  tags: [saas-linux-small-amd64]
  needs: []
  allow_failure: true
  timeout: 60m
  variables:
    GIT_DEPTH: "50"
  script:
    - npm ci
    - node scripts/ci/run-workspace-checks.mjs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Gemnasium analyzers are the real Dependency Scanning jobs (the
# `dependency_scanning` key is only a config stub); they run as Docker images,
# so they must never inherit a shell-runner default tag.
gemnasium-python-dependency_scanning:
  tags: [saas-linux-small-amd64]
  needs: []

gemnasium-dependency_scanning:
  tags: [saas-linux-small-amd64]
  needs: []
