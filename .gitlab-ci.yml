# Docs publishing only.
#
# The full test suite stays on GitHub Actions, where it already runs on a
# self-hosted runner (`wsl-mb`) and does not touch metered billing. This
# pipeline exists for one job GitHub currently cannot do: publish the
# Docusaurus site, because GitHub Pages deploys are blocked by the account's
# billing lock.
#
# Runs on a self-managed runner, so it consumes no GitLab compute minutes.

default:
  tags: [self-hosted]
  interruptible: true

stages: [build, deploy]

variables:
  NODE_ENV: production

build-docs:
  stage: build
  script:
    - cd website
    # Docusaurus is configured with baseUrl "/docs/" for the withmerlin.online
    # deployment. GitLab Pages serves a project site under /<project>/, so the
    # base URL has to be overridden here or every asset 404s.
    - npm ci --no-audit --no-fund
    - npm run build -- --base-url "/${CI_PROJECT_NAME}/"
  artifacts:
    paths:
      - website/build/
    expire_in: 1 week

pages:
  stage: deploy
  needs: [build-docs]
  script:
    - mkdir -p public
    - cp -r website/build/. public/
    - test -f public/index.html
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
