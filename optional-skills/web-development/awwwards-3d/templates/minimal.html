<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro 3D — Verified Render</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #06080c; }
        #app { width: 100vw; height: 100vh; }
        .hud {
            position: fixed; z-index: 10; color: #cfe8e4;
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 12px; letter-spacing: 0.04em;
            background: rgba(6, 10, 14, 0.55); border: 1px solid rgba(120, 200, 190, 0.18);
            padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(8px);
        }
        #stats { right: 20px; bottom: 20px; min-width: 170px; }
        #stats div { display: flex; justify-content: space-between; gap: 18px; line-height: 1.7; }
        #stats b { color: #6ee7d8; font-weight: 600; }
        #title { left: 24px; bottom: 20px; }
        #title h1 {
            font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 650;
            color: #eafffb; letter-spacing: -0.01em; margin-bottom: 2px;
        }
        #title p { font-family: 'Inter', sans-serif; font-size: 12px; color: #7fa8a2; }
        #load {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #6ee7d8; font-family: ui-monospace, monospace; font-size: 13px; z-index: 20;
            transition: opacity .6s ease; letter-spacing: .08em;
        }
        #load.done { opacity: 0; pointer-events: none; }
    </style>
    <!-- CRITICAL: importmap MUST come before any module script -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app"></div>
    <div id="load">initializing renderer…</div>
    <div class="hud" id="title">
        <h1>Physical Material Study</h1>
        <p>ACES · IBL environment · bloom · damped orbit — drag to rotate</p>
    </div>
    <div class="hud" id="stats">
        <div><span>FPS</span><b id="fps">—</b></div>
        <div><span>DRAW CALLS</span><b id="calls">—</b></div>
        <div><span>TRIANGLES</span><b id="tris">—</b></div>
        <div><span>GEOMETRIES</span><b id="geos">—</b></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        const app = document.getElementById('app');

        // Renderer — WebGL (universally supported, composer-compatible)
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        app.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06080c);
        scene.fog = new THREE.FogExp2(0x06080c, 0.045);

        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 0.6, 7.5);

        // Image-based lighting via PMREM room environment
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        // Key / rim lights on top of IBL
        const key = new THREE.DirectionalLight(0xfff4e0, 2.2);
        key.position.set(4, 6, 3);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0x3fae9e, 1.4);
        rim.position.set(-6, 3, -5);
        scene.add(rim);

        // Hero object: physical material with clearcoat
        const hero = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.15, 0.38, 220, 36),
            new THREE.MeshPhysicalMaterial({
                color: 0x8a1f2d, metalness: 0.9, roughness: 0.22,
                clearcoat: 1.0, clearcoatRoughness: 0.12, envMapIntensity: 1.3
            })
        );
        scene.add(hero);

        // Satellite spheres with varied materials
        const satGroup = new THREE.Group();
        const mats = [
            new THREE.MeshPhysicalMaterial({ color: 0xcfd6dd, metalness: 1.0, roughness: 0.08 }),
            new THREE.MeshPhysicalMaterial({ color: 0x1d6f63, metalness: 0.4, roughness: 0.35, transmission: 0.4, thickness: 0.6 }),
            new THREE.MeshStandardMaterial({ color: 0x2a2f38, metalness: 0.7, roughness: 0.5 })
        ];
        for (let i = 0; i < 9; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.16 + Math.random() * 0.14, 48, 32), mats[i % 3]);
            const a = (i / 9) * Math.PI * 2, r = 2.6 + Math.random() * 0.9;
            s.position.set(Math.cos(a) * r, (Math.random() - 0.5) * 2.2, Math.sin(a) * r);
            satGroup.add(s);
        }
        scene.add(satGroup);

        // Particle field
        const pN = 2200, pos = new Float32Array(pN * 3);
        for (let i = 0; i < pN; i++) {
            pos[i*3]   = (Math.random() - 0.5) * 26;
            pos[i*3+1] = (Math.random() - 0.5) * 16;
            pos[i*3+2] = (Math.random() - 0.5) * 26;
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
            color: 0x6ee7d8, size: 0.03, transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false
        }));
        scene.add(points);

        // Post-processing: bloom + output pass (WebGL pipeline)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.8, 0.85);
        composer.addPass(bloom);
        composer.addPass(new OutputPass());

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.7;
        controls.minDistance = 4;
        controls.maxDistance = 14;

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
        });

        // Real stats from renderer.info — no fake numbers
        window.__renderer = renderer; window.__scene = scene; // debug handles
        renderer.info.autoReset = false; // accumulate across ALL composer passes
        const $fps = document.getElementById('fps'), $calls = document.getElementById('calls'),
              $tris = document.getElementById('tris'), $geos = document.getElementById('geos');
        let tPrev = performance.now(), tStat = 0;
        function tick(t) {
            requestAnimationFrame(tick);
            const dt = Math.max((t - tPrev) / 1000, 1e-6); tPrev = t;
            renderer.info.reset();
            composer.render();
            if (t - tStat > 500) {
                tStat = t;
                $fps.textContent = Math.round(1 / dt);
                $calls.textContent = renderer.info.render.calls;
                $tris.textContent = renderer.info.render.triangles.toLocaleString();
                $geos.textContent = renderer.info.memory.geometries;
            }
            hero.rotation.x += dt * 0.18;
            hero.rotation.y += dt * 0.24;
            satGroup.rotation.y -= dt * 0.1;
            points.rotation.y += dt * 0.015;
            controls.update();
        }
        document.getElementById('load').classList.add('done');
        requestAnimationFrame(tick);
    </script>
</body>
</html>
