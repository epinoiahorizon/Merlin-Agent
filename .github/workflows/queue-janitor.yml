name: Queue janitor

# The runner queue on the free plan is shared by every workflow. Runs keep their
# place in it long after the commit stopped mattering: after PRs #68/#69 merged,
# their CI/Docker/E2E runs were still queued (10 of them, some three hours old),
# and a run of main's previous tip still sat behind them. Nothing cancels those
# automatically — concurrency groups only collapse runs on the SAME ref, and a
# merged branch never pushes again to trigger that.
#
# This janitor cancels only runs that are still queued/pending (never
# in_progress) when their commit can no longer be merged:
#   * the branch has no open PR (closed/merged) and is not the default branch
#   * the run's commit is not the current head of its branch or open PR
#   * for the default branch: the run's commit is no longer the tip of it
# Already-passing checks are therefore never re-run for nothing.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: queue-janitor
  cancel-in-progress: true

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel queued runs whose commit can no longer merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]

          def gh(path: str):
              out = subprocess.run(
                  ["gh", "api", "--paginate", path],
                  check=True, capture_output=True, text=True,
              ).stdout
              # --paginate concatenates JSON arrays; merge them
              dec = json.JSONDecoder()
              items, i = [], 0
              while i < len(out):
                  obj, end = dec.raw_decode(out, i)
                  if isinstance(obj, list):
                      items.extend(obj)
                  elif isinstance(obj, dict):
                      # list endpoints wrap their rows: {"total_count": n, "workflow_runs": [...]}
                      rows = obj.get("workflow_runs")
                      items.extend(rows if isinstance(rows, list) else [obj])
                  i = end
                  while i < len(out) and out[i] in " \n\r\t":
                      i += 1
              return items

          default_branch = gh(f"/repos/{repo}")[0]["default_branch"]
          main_sha = gh(f"/repos/{repo}/commits/{default_branch}")[0]["sha"]

          # head sha of every open PR, keyed by its branch name
          open_heads = {}
          for pr in gh(f"/repos/{repo}/pulls?state=open&per_page=100"):
              open_heads[pr["head"]["ref"]] = pr["head"]["sha"]

          # tip of every branch we still care about
          keep = {}
          for branch in open_heads:
              info = gh(f"/repos/{repo}/branches/{branch}")
              if info:
                  keep[branch] = info[0]["commit"]["sha"]

          victims = []
          for status in ("queued", "pending"):
              for run in gh(f"/repos/{repo}/actions/runs?status={status}&per_page=100"):
                  branch = run.get("head_branch") or ""
                  sha = run["head_sha"]
                  if branch == default_branch:
                      stale = sha != main_sha
                  else:
                      stale = keep.get(branch) != sha
                  if stale:
                      victims.append((run["id"], run["name"], branch, sha[:8], run["created_at"]))

          if not victims:
              print("queue clean: nothing to cancel")
              raise SystemExit(0)

          for run_id, name, branch, sha, created in victims:
              print(f"cancel {run_id} {name} [{branch}@{sha}] queued since {created}")
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"/repos/{repo}/actions/runs/{run_id}/cancel"],
                  check=False,
              )
          print(f"cancelled {len(victims)} superseded run(s)")
          PY

      - name: Drop caches for closed PRs, and trim if over the cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          CAP = 8 * 1000 ** 3          # trim to 8 GB, leaving headroom under GitHub's 10 GB
          KEEP_ALWAYS = ("refs/heads/",)

          def gh(path, method="GET"):
              cmd = ["gh", "api", "--paginate", path] if method == "GET" else ["gh", "api", "-X", method, path]
              out = subprocess.run(cmd, check=True, capture_output=True, text=True).stdout
              if method != "GET":
                  return []
              dec = json.JSONDecoder()
              items, i = [], 0
              while i < len(out):
                  obj, end = dec.raw_decode(out, i)
                  if isinstance(obj, list):
                      items.extend(obj)
                  elif isinstance(obj, dict):
                      rows = obj.get("actions_caches")
                      items.extend(rows if isinstance(rows, list) else [obj])
                  i = end
                  while i < len(out) and out[i] in " \n\r\t":
                      i += 1
              return items

          open_prs = {pr["number"] for pr in gh(f"/repos/{repo}/pulls?state=open&per_page=100")}
          caches = gh(f"/repos/{repo}/actions/caches?per_page=100")

          def pr_number(ref: str):
              parts = (ref or "").split("/")
              if len(parts) >= 4 and parts[1] == "pull":
                  try:
                      return int(parts[2])
                  except ValueError:
                      return None
              return None

          victims = []
          for c in caches:
              n = pr_number(c["ref"])
              if n is not None and n not in open_prs:
                  victims.append(c)

          keep = [c for c in caches if c not in victims]
          total = sum(c["size_in_bytes"] for c in keep)
          if total > CAP:
              # biggest first, never touch the default branch's own caches
              for c in sorted((c for c in keep if not (c["ref"] or "").startswith(KEEP_ALWAYS)),
                              key=lambda c: -c["size_in_bytes"]):
                  if total <= CAP:
                      break
                  victims.append(c)
                  total -= c["size_in_bytes"]

          if not victims:
              print(f"cache clean: {len(caches)} entries, {sum(c['size_in_bytes'] for c in caches)/1e9:.2f} GB")
              raise SystemExit(0)

          freed = 0
          for c in victims:
              print(f"purge {c['id']} {c['key'][:60]} [{c['ref']}] {c['size_in_bytes']/1e9:.2f} GB")
              subprocess.run(["gh", "api", "-X", "DELETE", f"/repos/{repo}/actions/caches/{c['id']}"],
                             check=False, capture_output=True)
              freed += c["size_in_bytes"]
          print(f"purged {len(victims)} cache(s), {freed/1e9:.2f} GB freed")
          PY

